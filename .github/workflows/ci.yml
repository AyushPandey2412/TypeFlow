name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/typeflow-build
          JWT_ACCESS_SECRET: ci-only-access-secret-with-more-than-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-with-more-than-32-characters
          FRONTEND_URL: http://localhost:3000
